  @font-face {
    font-family:"Great Vibes";
    src:url("./great-vibes-latin.woff2") format("woff2");
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }
  :root {
    color-scheme:dark;
    --paper:#05060a;
    --ink:#edf1ef;
    --muted:#aab2ae;
    --rule:#252a2f;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.5 "Inter","Microsoft YaHei UI",system-ui,sans-serif; }
  button,a { -webkit-tap-highlight-color:transparent; }
  button { font:inherit; color:inherit; cursor:pointer; }
  button:focus-visible,a:focus-visible { outline:2px solid #d9eddc; outline-offset:4px; }
  [hidden] { display:none !important; }
  .page {
    width:min(100%,1440px); min-height:100svh; margin:auto;
    padding:0 clamp(20px,4.4vw,64px);
    display:grid; grid-template-rows:64px minmax(430px,1fr) 72px;
  }
  header,footer { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  header { border-bottom:1px solid var(--rule); }
  h1 { display:flex; align-items:center; gap:11px; margin:0; font-size:15px; font-weight:630; white-space:nowrap; }
  .emblem { width:14px; height:14px; background:#ebcd95; clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%); }
  .qr-controls { display:flex; align-items:center; gap:clamp(12px,2.2vw,24px); white-space:nowrap; }
  .qr-controls button,.qr-controls a,.quiet-control { min-height:44px; display:inline-flex; align-items:center; padding:0; color:var(--muted); background:none; border:0; text-underline-offset:4px; }
  .qr-controls button:hover,.qr-controls a:hover,.quiet-control:hover { color:var(--ink); }
  .scene { --greeting-space:clamp(62px,10svh,88px); position:relative; min-width:0; }
  canvas { position:absolute; inset:0; display:block; width:100%; height:100%; cursor:pointer; touch-action:manipulation; }
  .greeting {
    position:absolute; inset:0 0 auto; z-index:1; height:var(--greeting-space); margin:0;
    display:grid; place-items:center; pointer-events:none;
  }
  .greeting-script {
    --writing:0%;
    display:block; padding:0.08em 0.32em 0.12em;
    color:#fff0cf; text-shadow:0 0 14px #ffdb866b;
    font:400 clamp(37px,6.3vw,66px)/1.12 "Great Vibes","Segoe Script",cursive;
    white-space:nowrap;
    mask-image:linear-gradient(to right,#000 calc(var(--writing) - 10%),transparent var(--writing));
  }
  footer { border-top:1px solid var(--rule); }
  .gesture-hint { margin:0; color:var(--muted); font-size:13px; }
  .actions { display:flex; gap:10px; margin-left:auto; }
  .actions button {
    display:inline-flex; align-items:center; justify-content:center; gap:9px; min-height:44px; padding:0 13px;
    color:#d1d8d3; background:#0c1014; border:1px solid var(--rule); border-radius:5px;
    font-size:13px; white-space:nowrap;
  }
  .actions button:hover { border-color:#667970; color:#fff; }
  .swatch { width:9px; height:9px; border-radius:50%; background:var(--swatch,#90e692); }
  .arrow { width:7px; height:7px; border:solid currentColor; border-width:1px 1px 0 0; transform:rotate(45deg); }
  #mode-toggle[aria-pressed="true"] .arrow { transform:rotate(-135deg); }
  @media (max-width:560px) {
    .page { grid-template-rows:56px minmax(360px,1fr) 64px; }
    .scene { --greeting-space:clamp(62px,10svh,76px); }
    .greeting-script { font-size:clamp(33px,10.6vw,49px); }
    .gesture-hint { display:none; }
    .actions { margin:0 auto; }
    .qr-controls { font-size:12px; }
  }
  @media (max-height:600px) and (min-width:561px) {
    .page { grid-template-rows:50px minmax(290px,1fr) 58px; }
    .greeting-script { font-size:clamp(35px,6.3vw,53px); }
  }
  @media (pointer:coarse) { .gesture-hint { display:none; } }

<body>
<div class="page">
  <header>
    <h1><span class="emblem" aria-hidden="true"></span>粒子圣诞树</h1>
    <button class="quiet-control" id="rotation-toggle" type="button">暂停旋转</button>
    <div class="qr-controls" id="qr-controls" hidden>
      <button id="scan-mode" type="button" aria-pressed="false">扫码模式</button>
      <a id="share-link" target="_blank" rel="noopener">页面链接</a>
    </div>
  </header>
  <main class="scene">
    <canvas id="art" aria-hidden="true"></canvas>
    <p class="greeting" id="greeting" lang="en"><span class="greeting-script" id="greeting-script">Merry Christmas</span></p>
  </main>
  <footer>
    <p class="gesture-hint" id="gesture-hint">双击切换二维码 · 右键换色</p>
    <div class="actions">
      <button id="mode-toggle" type="button" aria-pressed="false"><span id="mode-label">展开二维码</span><span class="arrow" aria-hidden="true"></span></button>
      <button id="theme-toggle" type="button"><span class="swatch" aria-hidden="true"></span>换色</button>
    </div>
  </footer>
</div>
<script>
/* 
 * QR Code generator library (TypeScript)
 * 
 * Copyright (c) Project Nayuki. (MIT License)
 * https://www.nayuki.io/page/qr-code-generator-library
 *

 * use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of
 * the Software, and to permit persons to whom the Software is furnished to do so,
 * subject to the following conditions:
 * - The above copyright notice and this permission notice shall be included in
 *   all copies or substantial portions of the Software.
 * - The Software is provided "as is", without warranty of any kind, express or
 *   implied, including but not limited to the warranties of merchantability,
 *   fitness for a particular purpose and noninfringement. In no event shall the
 *   authors or copyright holders be liable for any claim, damages or other
 *   liability, whether in an action of contract, tort or otherwise, arising from,
 *   out of or in connection with the Software or the use or other dealings in the
 *   Software.
 */
"use strict";
(function(qrcodegen) {
    class QrCode {
        version;
        errorCorrectionLevel;
        static encodeText(text, ecl) {
            const segs = qrcodegen.QrSegment.makeSegments(text);
            return QrCode.encodeSegments(segs, ecl);
        }
        static encodeBinary(data, ecl) {
            const seg = qrcodegen.QrSegment.makeBytes(data);
            return QrCode.encodeSegments([
                seg
            ], ecl);
        }
        static encodeSegments(segs, ecl, minVersion = 1, maxVersion = 40, mask = -1, boostEcl = true) {
            if (!(QrCode.MIN_VERSION <= minVersion && minVersion <= maxVersion && maxVersion <= QrCode.MAX_VERSION) || mask < -1 || mask > 7) throw new RangeError("Invalid value");
            let version;
            let dataUsedBits;
            for(version = minVersion;; version++){
                const dataCapacityBits = QrCode.getNumDataCodewords(version, ecl) * 8;
                const usedBits = QrSegment.getTotalBits(segs, version);
                if (usedBits <= dataCapacityBits) {
                    dataUsedBits = usedBits;
                    break;
                }
                if (version >= maxVersion) throw new RangeError("Data too long");
            }
            for (const newEcl of [
                QrCode.Ecc.MEDIUM,
                QrCode.Ecc.QUARTILE,
                QrCode.Ecc.HIGH
            ]){
                if (boostEcl && dataUsedBits <= QrCode.getNumDataCodewords(version, newEcl) * 8) ecl = newEcl;
            }
            let bb = [];
            for (const seg of segs){
                appendBits(seg.mode.modeBits, 4, bb);
                appendBits(seg.numChars, seg.mode.numCharCountBits(version), bb);
                for (const b of seg.getData())bb.push(b);
            }
            assert(bb.length == dataUsedBits);
            const dataCapacityBits = QrCode.getNumDataCodewords(version, ecl) * 8;
            assert(bb.length <= dataCapacityBits);
            appendBits(0, Math.min(4, dataCapacityBits - bb.length), bb);
            appendBits(0, (8 - bb.length % 8) % 8, bb);
            assert(bb.length % 8 == 0);
            for(let padByte = 0xEC; bb.length < dataCapacityBits; padByte ^= 0xEC ^ 0x11)appendBits(padByte, 8, bb);
            let dataCodewords = [];
            while(dataCodewords.length * 8 < bb.length)dataCodewords.push(0);
            bb.forEach((b, i)=>dataCodewords[i >>> 3] |= b << 7 - (i & 7));
            return new QrCode(version, ecl, dataCodewords, mask);
        }
        size;
        mask;
        modules = [];
        isFunction = [];
        constructor(version, errorCorrectionLevel, dataCodewords, msk){
            this.version = version;
            this.errorCorrectionLevel = errorCorrectionLevel;
            if (version < QrCode.MIN_VERSION || version > QrCode.MAX_VERSION) throw new RangeError("Version value out of range");
            if (msk < -1 || msk > 7) throw new RangeError("Mask value out of range");
            this.size = version * 4 + 17;
            let row = [];
            for(let i = 0; i < this.size; i++)row.push(false);
            for(let i = 0; i < this.size; i++){
                this.modules.push(row.slice());
                this.isFunction.push(row.slice());
            }
            this.drawFunctionPatterns();
            const allCodewords = this.addEccAndInterleave(dataCodewords);
            this.drawCodewords(allCodewords);
            if (msk == -1) {
                let minPenalty = 1000000000;
                for(let i = 0; i < 8; i++){
                    this.applyMask(i);
                    this.drawFormatBits(i);
                    const penalty = this.getPenaltyScore();
                    if (penalty < minPenalty) {
                        msk = i;
                        minPenalty = penalty;
                    }
                    this.applyMask(i);
                }
            }
            assert(0 <= msk && msk <= 7);
            this.mask = msk;
            this.applyMask(msk);
            this.drawFormatBits(msk);
            this.isFunction = [];
        }
        getModule(x, y) {
            return 0 <= x && x < this.size && 0 <= y && y < this.size && this.modules[y][x];
        }
        drawFunctionPatterns() {
            for(let i = 0; i < this.size; i++){
                this.setFunctionModule(6, i, i % 2 == 0);
                this.setFunctionModule(i, 6, i % 2 == 0);
            }
            this.drawFinderPattern(3, 3);
            this.drawFinderPattern(this.size - 4, 3);
            this.drawFinderPattern(3, this.size - 4);
            const alignPatPos = this.getAlignmentPatternPositions();
            const numAlign = alignPatPos.length;
            for(let i = 0; i < numAlign; i++){
                for(let j = 0; j < numAlign; j++){
                    if (!(i == 0 && j == 0 || i == 0 && j == numAlign - 1 || i == numAlign - 1 && j == 0)) this.drawAlignmentPattern(alignPatPos[i], alignPatPos[j]);
                }
            }
            this.drawFormatBits(0);
            this.drawVersion();
        }
        drawFormatBits(mask) {
            const data = this.errorCorrectionLevel.formatBits << 3 | mask;
            let rem = data;
            for(let i = 0; i < 10; i++)rem = rem << 1 ^ (rem >>> 9) * 0x537;
            const bits = (data << 10 | rem) ^ 0x5412;
            assert(bits >>> 15 == 0);
            for(let i = 0; i <= 5; i++)this.setFunctionModule(8, i, getBit(bits, i));
            this.setFunctionModule(8, 7, getBit(bits, 6));
            this.setFunctionModule(8, 8, getBit(bits, 7));
            this.setFunctionModule(7, 8, getBit(bits, 8));
            for(let i = 9; i < 15; i++)this.setFunctionModule(14 - i, 8, getBit(bits, i));
            for(let i = 0; i < 8; i++)this.setFunctionModule(this.size - 1 - i, 8, getBit(bits, i));
            for(let i = 8; i < 15; i++)this.setFunctionModule(8, this.size - 15 + i, getBit(bits, i));
            this.setFunctionModule(8, this.size - 8, true);
        }
        drawVersion() {
            if (this.version < 7) return;
            let rem = this.version;
            for(let i = 0; i < 12; i++)rem = rem << 1 ^ (rem >>> 11) * 0x1F25;
            const bits = this.version << 12 | rem;
            assert(bits >>> 18 == 0);
            for(let i = 0; i < 18; i++){
                const color = getBit(bits, i);
                const a = this.size - 11 + i % 3;
                const b = Math.floor(i / 3);
                this.setFunctionModule(a, b, color);
                this.setFunctionModule(b, a, color);
            }
        }
        drawFinderPattern(x, y) {
            for(let dy = -4; dy <= 4; dy++){
                for(let dx = -4; dx <= 4; dx++){
                    const dist = Math.max(Math.abs(dx), Math.abs(dy));
                    const xx = x + dx;
                    const yy = y + dy;
                    if (0 <= xx && xx < this.size && 0 <= yy && yy < this.size) this.setFunctionModule(xx, yy, dist != 2 && dist != 4);
                }
            }
        }
        drawAlignmentPattern(x, y) {
            for(let dy = -2; dy <= 2; dy++){
                for(let dx = -2; dx <= 2; dx++)this.setFunctionModule(x + dx, y + dy, Math.max(Math.abs(dx), Math.abs(dy)) != 1);
            }
        }
        setFunctionModule(x, y, isDark) {
            this.modules[y][x] = isDark;
            this.isFunction[y][x] = true;
        }
        addEccAndInterleave(data) {
            const ver = this.version;
            const ecl = this.errorCorrectionLevel;
            if (data.length != QrCode.getNumDataCodewords(ver, ecl)) throw new RangeError("Invalid argument");
            const numBlocks = QrCode.NUM_ERROR_CORRECTION_BLOCKS[ecl.ordinal][ver];
            const blockEccLen = QrCode.ECC_CODEWORDS_PER_BLOCK[ecl.ordinal][ver];
            const rawCodewords = Math.floor(QrCode.getNumRawDataModules(ver) / 8);
            const numShortBlocks = numBlocks - rawCodewords % numBlocks;
            const shortBlockLen = Math.floor(rawCodewords / numBlocks);
            let blocks = [];
            const rsDiv = QrCode.reedSolomonComputeDivisor(blockEccLen);
            for(let i = 0, k = 0; i < numBlocks; i++){
                let dat = data.slice(k, k + shortBlockLen - blockEccLen + (i < numShortBlocks ? 0 : 1));
                k += dat.length;
                const ecc = QrCode.reedSolomonComputeRemainder(dat, rsDiv);
                if (i < numShortBlocks) dat.push(0);
                blocks.push(dat.concat(ecc));
            }
            let result = [];
            for(let i = 0; i < blocks[0].length; i++){
                blocks.forEach((block, j)=>{
                    if (i != shortBlockLen - blockEccLen || j >= numShortBlocks) result.push(block[i]);
                });
            }
            assert(result.length == rawCodewords);
            return result;
        }
        drawCodewords(data) {
            if (data.length != Math.floor(QrCode.getNumRawDataModules(this.version) / 8)) throw new RangeError("Invalid argument");
            let i = 0;
            for(let right = this.size - 1; right >= 1; right -= 2){
                if (right == 6) right = 5;
                for(let vert = 0; vert < this.size; vert++){
                    for(let j = 0; j < 2; j++){
                        const x = right - j;
                        const upward = (right + 1 & 2) == 0;
                        const y = upward ? this.size - 1 - vert : vert;
                        if (!this.isFunction[y][x] && i < data.length * 8) {
                            this.modules[y][x] = getBit(data[i >>> 3], 7 - (i & 7));
                            i++;
                        }
                    }
                }
            }
            assert(i == data.length * 8);
        }
        applyMask(mask) {
            if (mask < 0 || mask > 7) throw new RangeError("Mask value out of range");
            for(let y = 0; y < this.size; y++){
                for(let x = 0; x < this.size; x++){
                    let invert;
                    switch(mask){
                        case 0:
                            invert = (x + y) % 2 == 0;
                            break;
                        case 1:
                            invert = y % 2 == 0;
                            break;
                        case 2:
                            invert = x % 3 == 0;
                            break;
                        case 3:
                            invert = (x + y) % 3 == 0;
                            break;
                        case 4:
                            invert = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 == 0;
                            break;
                        case 5:
                            invert = x * y % 2 + x * y % 3 == 0;
                            break;
                        case 6:
                            invert = (x * y % 2 + x * y % 3) % 2 == 0;
                            break;
                        case 7:
                            invert = ((x + y) % 2 + x * y % 3) % 2 == 0;
                            break;
                        default:
                            throw new Error("Unreachable");
                    }
                    if (!this.isFunction[y][x] && invert) this.modules[y][x] = !this.modules[y][x];
                }
            }
        }
        getPenaltyScore() {
            let result = 0;
            for(let y = 0; y < this.size; y++){
                let runColor = false;
                let runX = 0;
                let runHistory = [
                    0,
                    0,
                    0,
                    0,
                    0,
                    0,
                    0
                ];
                for(let x = 0; x < this.size; x++){
                    if (this.modules[y][x] == runColor) {
                        runX++;
                        if (runX == 5) result += QrCode.PENALTY_N1;
                        else if (runX > 5) result++;
                    } else {
                        this.finderPenaltyAddHistory(runX, runHistory);
                        if (!runColor) result += this.finderPenaltyCountPatterns(runHistory) * QrCode.PENALTY_N3;
                        runColor = this.modules[y][x];
                        runX = 1;
                    }
                }
                result += this.finderPenaltyTerminateAndCount(runColor, runX, runHistory) * QrCode.PENALTY_N3;
            }
            for(let x = 0; x < this.size; x++){
                let runColor = false;
                let runY = 0;
                let runHistory = [
                    0,
                    0,
                    0,
                    0,
                    0,
                    0,
                    0
                ];
                for(let y = 0; y < this.size; y++){
                    if (this.modules[y][x] == runColor) {
                        runY++;
                        if (runY == 5) result += QrCode.PENALTY_N1;
                        else if (runY > 5) result++;
                    } else {
                        this.finderPenaltyAddHistory(runY, runHistory);
                        if (!runColor) result += this.finderPenaltyCountPatterns(runHistory) * QrCode.PENALTY_N3;
                        runColor = this.modules[y][x];
                        runY = 1;
                    }
                }
                result += this.finderPenaltyTerminateAndCount(runColor, runY, runHistory) * QrCode.PENALTY_N3;
            }
            for(let y = 0; y < this.size - 1; y++){
                for(let x = 0; x < this.size - 1; x++){
                    const color = this.modules[y][x];
                    if (color == this.modules[y][x + 1] && color == this.modules[y + 1][x] && color == this.modules[y + 1][x + 1]) result += QrCode.PENALTY_N2;
                }
            }
            let dark = 0;
            for (const row of this.modules)dark = row.reduce((sum, color)=>sum + (color ? 1 : 0), dark);
            const total = this.size * this.size;
            const k = Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1;
            assert(0 <= k && k <= 9);
            result += k * QrCode.PENALTY_N4;
            assert(0 <= result && result <= 2568888);
            return result;
        }
        getAlignmentPatternPositions() {
            if (this.version == 1) return [];
            else {
                const numAlign = Math.floor(this.version / 7) + 2;
                const step = this.version == 32 ? 26 : Math.ceil((this.version * 4 + 4) / (numAlign * 2 - 2)) * 2;
                let result = [
                    6
                ];
                for(let pos = this.size - 7; result.length < numAlign; pos -= step)result.splice(1, 0, pos);
                return result;
            }
        }
        static getNumRawDataModules(ver) {
            if (ver < QrCode.MIN_VERSION || ver > QrCode.MAX_VERSION) throw new RangeError("Version number out of range");
            let result = (16 * ver + 128) * ver + 64;
            if (ver >= 2) {
                const numAlign = Math.floor(ver / 7) + 2;
                result -= (25 * numAlign - 10) * numAlign - 55;
                if (ver >= 7) result -= 36;
            }
            assert(208 <= result && result <= 29648);
            return result;
        }
        static getNumDataCodewords(ver, ecl) {
            return Math.floor(QrCode.getNumRawDataModules(ver) / 8) - QrCode.ECC_CODEWORDS_PER_BLOCK[ecl.ordinal][ver] * QrCode.NUM_ERROR_CORRECTION_BLOCKS[ecl.ordinal][ver];
        }
        static reedSolomonComputeDivisor(degree) {

let numberFont;
let ornamentFont;
let floorRadius = 0;
let floorY = 0;
let qrLayout;
let paletteIndex = 0;
let paletteProgress = 1;
let activeColors = Array.from({length:paletteBands},()=>colorSets[0]);
let paletteFrom = activeColors;
let activeStyles = activeColors.map(colors=>colors.map(color=>cssColor(color)));
let cubePaletteDirty = true;
let showCode = false;
let scanMode = false;
let progress = 0;
let entranceProgress = 0;
let lastWriting = -1;
let seconds = 0;
let rotation = Math.PI/7;
let rotationPaused = false;
let raf = 0;
let lastTime = 0;
let touchStart = null;
let firstTap = null;
let lastTouchTime = -Infinity;

function resize() {
  width = canvas.clientWidth;
  height = canvas.clientHeight;
  if (!width || !height) return;
  ratio = Math.min(2.5,devicePixelRatio || 1);
  canvas.width = Math.round(width*ratio);
  canvas.height = Math.round(height*ratio);
  ctx.setTransform(ratio,0,0,ratio,0,0);
  // Render the light on a smaller surface so blurring it does not soften the characters.
  glowCanvas.width = bloomCanvas.width = Math.max(1,Math.ceil(width*0.42));
  glowCanvas.height = bloomCanvas.height = Math.max(1,Math.ceil(height*0.42));
  glowCtx.setTransform(glowCanvas.width/width,0,0,glowCanvas.height/height,0,0);
  glowCtx.globalCompositeOperation = 'lighter';
  glowCtx.lineCap = 'round';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineCap = 'round';
  const greetingHeight = greeting.offsetHeight;
  const treeAreaHeight = height-greetingHeight;
  scale = Math.min(width*0.49,treeAreaHeight*0.392,315);
  numberFont = `500 ${Math.max(4.7,scale*0.0315)}px "Cascadia Code", Consolas, monospace`;
  ornamentFont = `500 ${Math.max(3.9,scale*0.026)}px "Cascadia Code", Consolas, monospace`;
  sceneX = width/2;
  sceneY = greetingHeight+treeAreaHeight*0.491;
  floorRadius = maxTreeRadius*scale*1.13;
  floorY = sceneY+scale*1.06;
  const unit = Math.max(1,Math.floor(Math.min(
    scale*qrSpan/gridSize,(width-8)/(gridSize+8),(height-8)/(gridSize+8)
  )));
  const size = unit*gridSize;
  qrLayout = {unit,size,x:Math.round(sceneX-size/2),y:Math.round(sceneY-size/2)};
  render();
}

function refreshColors() {
  const next = colorSets[paletteIndex];
  activeColors = paletteFrom.map((colors,index)=>{
    const stagger = (index/(paletteBands-1))*0.44;
    const factor = smooth(clamp(paletteProgress*1.44-stagger,0,1));
    return colors.map((color,slot)=>mixColor(color,next[slot],factor));
  });
  activeStyles = activeColors.map(colors=>colors.map(color=>cssColor(color)));
  cubePaletteDirty = true;
  themeButton.style.setProperty('--swatch',activeStyles[8][2]);
}

function refreshCubeAtlas() {
  // Cache the faceted sprites for each palette band and reuse them across the particle cloud.
  cubeCtx.resetTransform();
  cubeCtx.clearRect(0,0,cubeAtlas.width,cubeAtlas.height);
  for (const [band,colors] of activeColors.entries()) {
    for (const [slot,color] of colors.entries()) {
      cubeCtx.setTransform(1,0,0,1,slot*cubeTile,band*cubeTile);
      for (const {path,shade,highlight} of cubeFaces) {
        const tint = color.map(channel=>Math.round(mix(channel*shade,255,highlight)));
        cubeCtx.fillStyle = cssColor(tint);
        cubeCtx.fill(path);
      }
    }
  }
  cubePaletteDirty = false;
}

function drawCube(band,slot,x,y,size,opacity) {
  ctx.globalAlpha = opacity;
  ctx.drawImage(cubeAtlas,slot*cubeTile,band*cubeTile,cubeTile,cubeTile,x-size/2,y-size/2,size,size);
}

function drawFloorLight(t,rise) {
  const ignition = 0.30+0.70*smooth(clamp(rise/0.28,0,1));
  const opacity = (1-smooth(clamp((t-0.10)/0.55,0,1)))*ignition;
  if (opacity===0) return;

  const tint = activeColors[paletteBands-2][2];
  ctx.save();
  ctx.translate(sceneX,floorY);
  ctx.scale(floorRadius,floorRadius*0.235);

  // Project a radial falloff onto the ground plane below the canopy.
  const light = ctx.createRadialGradient(0,0,0,0,0,1);
  light.addColorStop(0,cssColor(tint,0.39*opacity));
  light.addColorStop(0.33,cssColor(tint,0.25*opacity));
  light.addColorStop(0.67,cssColor(tint,0.105*opacity));
  light.addColorStop(0.90,cssColor(tint,0.032*opacity));
  light.addColorStop(1,cssColor(tint,0));
  ctx.fillStyle = light;
  ctx.beginPath();
  ctx.arc(0,0,1,0,tau);
  ctx.fill();

  // A wide, low-contrast pulse travels outward inside the illuminated area.
  const phase = (seconds*0.43)%1;
  const waveRadius = 0.12+0.77*(1-Math.pow(1-phase,1.4));
  const wave = ctx.createRadialGradient(0,0,0,0,0,1);
  wave.addColorStop(Math.max(0,waveRadius-0.23),cssColor(tint,0));
  wave.addColorStop(waveRadius,cssColor(tint,Math.sin(phase*Math.PI)*0.13*opacity));
  wave.addColorStop(Math.min(1,waveRadius+0.20),cssColor(tint,0));
  ctx.fillStyle = wave;
  ctx.fill();
  ctx.restore();
}

function drawAtmosphere(t,rise) {
  const qrMix = smooth(t);
  const tint = activeColors[10][2];
  const halo = ctx.createRadialGradient(sceneX,sceneY+scale*0.16,0,sceneX,sceneY+scale*0.16,scale*1.68);
  halo.addColorStop(0,cssColor(tint,0.125*(1-qrMix)+0.028+Math.sin(Math.PI*t)*0.045));
  halo.addColorStop(1,cssColor(tint,0));
  ctx.fillStyle = halo;
  ctx.fillRect(0,0,width,height);
  drawFloorLight(t,rise);

  const snowCount = Math.min(flakes.length,Math.round(54+width*0.078));
  const fieldWidth = width+48;
  const fieldHeight = height+36;
  const clearance = qrLayout.size*0.5+qrLayout.unit*4;
  const quietOpacity = 1-smooth(clamp((qrMix-0.68)/0.32,0,1));
  ctx.fillStyle = '#ffffff';
  for (let i=0;i<snowCount;i++) {
    const flake = flakes[i];
    const drift = Math.sin(seconds*flake.sway+flake.phase)*flake.drift + seconds*flake.wind;
    const x = ((flake.x*fieldWidth+drift)%fieldWidth+fieldWidth)%fieldWidth-24;
    const y = (flake.y*fieldHeight+seconds*flake.speed)%fieldHeight-18;
    const insideCode = Math.abs(x-sceneX)<clearance && Math.abs(y-sceneY)<clearance;
    ctx.globalAlpha = flake.opacity*(insideCode ? quietOpacity : 1);
    if (ctx.globalAlpha===0) continue;
    ctx.beginPath();
    ctx.arc(x,y,flake.size,0,tau);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function buildEntranceSpiral(rise) {
  const gentle = reducedMotion.matches;
  const turns = gentle ? 2.06 : 2.78;
  const tail = Math.max(0,rise-(gentle ? 0.51 : 0.55));
  const steps = Math.max(2,Math.ceil((rise-tail)*164));
  const baseRadius = Math.min(maxTreeRadius*1.13,width*0.47/scale);
  const points = [];
  for (let index=0;index<=steps;index++) {
    const trail = index/steps;
    const travel = mix(tail,rise,trail);
    const angle = 0.71+travel*turns*tau+rotation*0.27;
    const radius = baseRadius*Math.pow(1-travel,0.83)*smooth(Math.min(1,travel/0.115));
    const depth = Math.cos(angle)*radius;
    const perspective = 1/(1-depth*0.17);
    const y = mix(spiralStartY,spiralEndY,travel);
    points.push({
      x:sceneX+Math.sin(angle)*radius*perspective*scale,
      y:sceneY+(y+depth*0.15)*perspective*scale,
      depth,
      trail
    });
  }
  return points;
}

function drawEntranceTrail(points,tint,opacity,front) {
  const lineWidth = Math.max(1.15,scale*0.0065);
  const depthLight = front ? 1 : 0.46;
  ctx.strokeStyle = cssColor(mixColor(tint,[255,250,229],0.76));
  glowCtx.strokeStyle = cssColor(tint);
  for (let index=1;index<points.length;index++) {
    const from = points[index-1];
    const to = points[index];
    if ((from.depth+to.depth>=0)!==front) continue;
    const brightness = opacity*Math.pow(to.trail,0.79)*depthLight;
    ctx.globalAlpha = brightness*0.94;
    ctx.lineWidth = lineWidth*(0.42+0.78*to.trail);
    ctx.beginPath();
    ctx.moveTo(from.x,from.y);
    ctx.lineTo(to.x,to.y);
    ctx.stroke();
    glowCtx.globalAlpha = brightness*0.64;
    glowCtx.lineWidth = lineWidth*(2.2+2.1*to.trail);
    glowCtx.beginPath();
    glowCtx.moveTo(from.x,from.y);
    glowCtx.lineTo(to.x,to.y);
    glowCtx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawEntranceHead(head,tint,opacity) {
  const radius = Math.max(11,scale*0.062);
  const strength = opacity*(head.depth>=0 ? 1 : 0.69);
  const halo = ctx.createRadialGradient(head.x,head.y,0,head.x,head.y,radius);
  halo.addColorStop(0,cssColor([255,249,225],strength));
  halo.addColorStop(0.19,cssColor(tint,strength*0.82));
  halo.addColorStop(0.48,cssColor(tint,strength*0.24));
  halo.addColorStop(1,cssColor(tint,0));
  ctx.fillStyle = halo;
  ctx.fillRect(head.x-radius,head.y-radius,radius*2,radius*2);
}

function drawBloom() {
  bloomCtx.clearRect(0,0,bloomCanvas.width,bloomCanvas.height);
  bloomCtx.globalCompositeOperation = 'lighter';
  bloomCtx.filter = 'blur(1.6px)';
  bloomCtx.globalAlpha = 0.92;
  bloomCtx.drawImage(glowCanvas,0,0);
  bloomCtx.filter = 'blur(4.8px)';
  bloomCtx.globalAlpha = 0.46;
  bloomCtx.drawImage(glowCanvas,0,0);
  ctx.globalCompositeOperation = 'screen';
  ctx.drawImage(bloomCanvas,0,0,width,height);
  ctx.globalCompositeOperation = 'source-over';
}

function drawCode(target) {
  const {x,y,unit,size} = qrLayout;
  target.globalAlpha = target===glowCtx ? 0.18 : 1;
  if (scanMode) {
    target.fillStyle = '#ffffff';
    target.fillRect(x-4*unit,y-4*unit,size+8*unit,size+8*unit);
  }
  for (const module of code.modules) {
    const band = Math.round(module.row/(gridSize-1)*(paletteBands-1));
    target.fillStyle = scanMode ? '#101014' : activeStyles[band][module.slot];
    target.fillRect(x+module.col*unit,y+module.row*unit,unit,unit);
  }
}

function drawParticles(t,rise) {
  const {x:qrX,y:qrY,unit,size:codeSize} = qrLayout;
  const reduce = reducedMotion.matches;
  // Turn as one tree first. Scatter outward before the code begins to take shape.
  const turn = rotation+tau*(reduce ? 0.59 : 0.82)*smooth(clamp(t/0.88,0,1));
  const sine = Math.sin(turn);
  const cosine = Math.cos(turn);
  const scatter = smooth(clamp((t-0.07)/0.38,0,1))*(reduce ? 0.74 : 1);
  const horizontalRoom = clamp((width/scale-1.72)/0.98,0.27,1);
  const roll = Math.sin(t*Math.PI)*(reduce ? 0.10 : 0.19)*(0.48+0.52*horizontalRoom);
  const cosRoll = Math.cos(roll);
  const sinRoll = Math.sin(roll);
  const haloSize = Math.max(4,scale*0.022);
  const expansion = 1+scatter*0.24*horizontalRoom;
  const spreadFit = 1-scatter*(1-horizontalRoom)*0.14;
  const scatteredCube = Math.max(4.2,scale*0.027);
  const gatheredBlock = Math.max(1,unit/code.subdivisions+0.14);
  const separating = smooth(clamp((t-0.11)/0.28,0,1));
  const revealY = mix(spiralStartY,spiralEndY,rise);
  const starReveal = smooth(clamp((rise-0.87)/0.13,0,1));
  let currentFont = numberFont;
  ctx.font = currentFont;
  if (t>0 && cubePaletteDirty) refreshCubeAtlas();
  for (const point of particles) {
    const onStar = point.slot===starSlot;
    const reveal = rise===1 ? 1 : onStar ? starReveal : smooth(clamp((point.y-revealY+0.045)/0.17,0,1));
    if (reveal===0) continue;
    const gather = smooth(clamp((t-0.40-(point.target.y+0.5)*0.12)/0.48,0,1));
    // Fade a stable subset during dispersion, then bring it back into the QR grid as it gathers.
    const looseness = separating*(1-smooth(clamp((gather-0.28)/0.64,0,1)));
    const density = mix(1,dispersedCubeDensity,looseness);
    const presence = looseness===0 ? 1 :
      smooth(clamp(0.5+(density-point.scatterOrder)/(0.10*looseness),0,1));
    if (presence===0) continue;
    const depth = point.z*cosine-point.x*sine;
    const sideways = point.x*cosine+point.z*sine;
    const facing = onStar ? 1 : depth/point.radius;
    const visible = clamp((facing+0.12)/0.49,0,1);
    const coverage = mix(visible,1,Math.max(gather,scatter*0.83))*presence*reveal;
    if (coverage<0.012) continue;

    const drift = (point.scatterX*cosine+point.scatterZ*sine)*scatter;
    const distance = depth+(point.scatterZ*cosine-point.scatterX*sine)*scatter;
    const perspective = 1/(1-distance*0.17);
    const treeX = (sideways*expansion+drift*horizontalRoom)*perspective*scale;
    const treeY = (point.y*(1-scatter*0.17)+distance*0.15+point.scatterY*scatter)*perspective*scale;
    const rolledX = (treeX*cosRoll-treeY*sinRoll)*spreadFit;
    const rolledY = treeX*sinRoll+treeY*cosRoll;
    const x = mix(sceneX+rolledX,qrX+(point.target.x+0.5)*codeSize,gather);
    const y = mix(sceneY+rolledY,qrY+(point.target.y+0.5)*codeSize,gather);
    const twinkle = reduce ? 0.95 : 0.92+0.08*Math.sin(seconds*2.0+point.phase);
    const light = onStar ? 1 : 0.68+clamp(facing,0,1)*0.32;
    const opacity = mix(light*twinkle,1,gather)*coverage;
    const colors = activeColors[point.band];
    const color = gather===0 ? activeStyles[point.band][point.slot] :
      cssColor(mixColor(colors[point.slot],activeColors[point.targetBand][point.target.slot],gather));
    ctx.fillStyle = color;
    const cubeBlend = smooth(clamp((Math.max(gather,scatter)-0.12)/0.51,0,1));
    glowCtx.fillStyle = color;
    const accent = point.slot>=garlandSlot;
    const halo = haloSize*(onStar ? 1.30 : accent ? 1.15 : 1)*mix(1,clamp(point.cubeScale,0.62,1.42)*0.84,cubeBlend);
    const size = mix(halo,gatheredBlock+1,gather);
    const sweep = rise<1 ? Math.max(0,1-Math.abs(point.y-revealY)/0.20) : 0;
    const strength = (accent ? 0.47 : 0.29)+scatter*0.22+sweep*0.25;
    glowCtx.globalAlpha = opacity*mix(strength*(1-cubeBlend*0.44),0.19,gather);
    glowCtx.fillRect(x-size/2,y-size/2,size,size);
    if (cubeBlend<1) {
      const font = onStar||point.slot>=baubleSlot ? ornamentFont : numberFont;
      if (font!==currentFont) {
        ctx.font = font;
        currentFont = font;
      }
      ctx.globalAlpha = opacity*(1-cubeBlend);
      ctx.fillText(point.glyph,x,y);
    }
    if (cubeBlend>0) {
      const flatten = smooth(clamp((gather-0.84)/0.16,0,1));
      const cubeOpacity = opacity*cubeBlend*(1-flatten);
      if (cubeOpacity>0.008) {
        const shapeSize = scatteredCube*point.cubeScale*(accent ? 1.34 : 1)*perspective;
        const cubeSize = mix(shapeSize,gatheredBlock*1.45,gather);
        const recolor = smooth(clamp((gather-0.25)/0.59,0,1));
        if (recolor<1) drawCube(point.band,point.slot,x,y,cubeSize,cubeOpacity*(1-recolor));
        if (recolor>0) drawCube(point.targetBand,point.target.slot,x,y,cubeSize,cubeOpacity*recolor);
      }
      if (flatten>0) {
        ctx.globalAlpha = opacity*flatten;
        ctx.fillRect(x-gatheredBlock/2,y-gatheredBlock/2,gatheredBlock,gatheredBlock);
      }
    }
  }
  ctx.globalAlpha = 1;
}

function render() {
  if (!width || !height) return;
  const writing = smooth(clamp((entranceProgress-0.11)/0.69,0,1));
  if (writing!==lastWriting) {
    greetingScript.style.setProperty('--writing',`${writing*110}%`);
    lastWriting = writing;
  }
  ctx.clearRect(0,0,width,height);
  glowCtx.clearRect(0,0,width,height);
  const rise = 1-Math.pow(1-clamp(entranceProgress/0.85,0,1),1.16);
  drawAtmosphere(progress,rise);
  if (progress===1) {
    if (!scanMode) {
      drawCode(glowCtx);
      drawBloom();
    }
    drawCode(ctx);
  } else {
    const lightOpacity = (1-smooth(clamp((entranceProgress-0.79)/0.21,0,1)))*
      (1-smooth(clamp(progress/0.23,0,1)));
    const spiral = lightOpacity>0 ? buildEntranceSpiral(rise) : null;
    const tint = spiral ? mixColor(activeColors[8][2],activeColors[8][starSlot],0.60) : null;
    if (spiral) drawEntranceTrail(spiral,tint,lightOpacity,false);
    drawParticles(progress,rise);
    if (spiral) {
      drawEntranceTrail(spiral,tint,lightOpacity,true);
      drawEntranceHead(spiral[spiral.length-1],tint,lightOpacity);
    }
    drawBloom();
  }
}

function animationFrame(time) {
  raf = 0;
  const elapsed = lastTime ? Math.min(50,time-lastTime) : 16;
  lastTime = time;
  const reduce = reducedMotion.matches;
  seconds += elapsed/1000*(reduce ? 0.72 : 1);
  const entranceDuration = showCode ? 300 : 2860;
  entranceProgress = Math.min(1,entranceProgress+elapsed/entranceDuration);
  const morphDuration = reduce ? 1250 : 1440;
  progress = clamp(progress+(showCode?1:-1)*elapsed/morphDuration,0,1);
  const rotating = progress<1 && !rotationPaused;
  if (rotating) {
    const turnDuration = reduce ? 13400 : 10400;
    rotation = (rotation+elapsed*tau/turnDuration)%tau;
  }
  if (paletteProgress<1) {
    paletteProgress = Math.min(1,paletteProgress+elapsed/920);
    refreshColors();
  }
  render();
  if (!document.hidden) raf = requestAnimationFrame(animationFrame);
}

function restartAnimation() {
  if (raf) cancelAnimationFrame(raf);
  raf = 0;
  lastTime = 0;
  if (!document.hidden) raf = requestAnimationFrame(animationFrame);
}

function setScanMode(enabled) {
  scanMode = enabled;
  scanButton.setAttribute('aria-pressed',String(scanMode));
  scanButton.textContent = scanMode ? '彩色模式' : '扫码模式';
}

function toggleCode() {
  showCode = !showCode;
  setScanMode(false);
  modeButton.setAttribute('aria-pressed',String(showCode));
  rotationButton.hidden = showCode;
  qrControls.hidden = !showCode;
  modeLabel.textContent = showCode ? '返回圣诞树' : '展开二维码';
  hint.textContent = showCode ? '双击返回圣诞树 · 右键换色' : '双击切换二维码 · 右键换色';
}

function cycleTheme() {
  paletteIndex = (paletteIndex+1)%themes.length;
  paletteFrom = activeColors;
  paletteProgress = 0;
  themeButton.setAttribute('aria-label','换色，当前'+themes[paletteIndex].name);
}

canvas.addEventListener('dblclick',event=>{
  if (!event.sourceCapabilities?.firesTouchEvents && performance.now()-lastTouchTime>500) toggleCode();
});
canvas.addEventListener('contextmenu',event=>{
  event.preventDefault();
  if (event.pointerType!=='touch' && !event.sourceCapabilities?.firesTouchEvents) cycleTheme();
});
canvas.addEventListener('pointerdown',event=>{
  if (event.pointerType==='touch' && event.isPrimary) {
    touchStart = {id:event.pointerId,x:event.clientX,y:event.clientY};
  }
});
canvas.addEventListener('pointercancel',()=>{
  touchStart = null;
  firstTap = null;
});
canvas.addEventListener('pointerup',event=>{
  if (!touchStart || event.pointerId!==touchStart.id) return;
  const {clientX:x,clientY:y} = event;
  const moved = Math.hypot(x-touchStart.x,y-touchStart.y)>18;
  touchStart = null;
  lastTouchTime = performance.now();
  if (moved) {
    firstTap = null;
    return;
  }
  if (firstTap && lastTouchTime-firstTap.time<370 && Math.hypot(x-firstTap.x,y-firstTap.y)<30) {
    firstTap = null;
    toggleCode();
  } else {
    firstTap = {x,y,time:lastTouchTime};
  }
});
rotationButton.addEventListener('click',()=>{
  rotationPaused = !rotationPaused;
  rotationButton.textContent = rotationPaused ? '继续旋转' : '暂停旋转';
});
modeButton.addEventListener('click',toggleCode);
themeButton.addEventListener('click',cycleTheme);
scanButton.addEventListener('click',()=>{
  setScanMode(!scanMode);
  render();
});

if (ctx) {
  themeButton.setAttribute('aria-label','换色，当前'+themes[0].name);
  resize();
  new ResizeObserver(resize).observe(canvas);
  reducedMotion.addEventListener('change',restartAnimation);
  document.addEventListener('visibilitychange',restartAnimation);
  restartAnimation();
}
</script>
</body>
</html>
